openapi: 3.1.0
info:
  title: TreeList Component Contracts
  version: 1.0.0
  description: >
    UI-only component. No external HTTP API endpoints are defined.
    This document captures data schemas used by the component.
paths: {}
components:
  schemas:
    TreeNode:
      type: object
      additionalProperties: false
      required:
        - id
        - label
      properties:
        id:
          type: string
          description: Unique identifier within the parent scope
        label:
          type: string
        disabled:
          type: boolean
          default: false
        metadata:
          type: object
          additionalProperties: true
        children:
          type: array
          items:
            $ref: '#/components/schemas/TreeNode'
    TreeData:
      type: array
      description: Root-level collection of TreeNode
      items:
        $ref: '#/components/schemas/TreeNode'
    ExpandState:
      type: object
      description: Expansion map keyed by TreeNode id
      additionalProperties:
        type: boolean



