image: node:22

definitions:
  caches:
    node: node_modules
    npm: $HOME/.npm
    playwright: $HOME/.cache/ms-playwright
  steps:
    - step: &test
        name: Run Tests with Coverage
        caches:
          - npm
          - node
          - playwright
        script:
          - npm ci
          - npx playwright install --with-deps chromium
          - npm run coverage
    - step: &chromatic
        name: Deploy to Chromatic
        caches:
          - npm
          - node
        script:
          - npm ci
          - npm run deploy
    - step: &vercel
        name: Deploy to Vercel
        caches:
          - npm
          - node
        script:
          - npm ci
          - npm install -g vercel
          - vercel link --project=reltio-design --scope=reltio --token=${VERCEL_TOKEN} --yes
          - vercel build --scope=reltio --token=${VERCEL_TOKEN} --prod --yes
          - vercel deploy --scope=reltio --token=${VERCEL_TOKEN} --prod --prebuilt
    - step: &publish-reltio-design
        name: Publish @reltio/design package to NPM
        script:
          - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          - npm ci
          - npm run build-css
          - cd packages/design
          - npm ci
          - npm run build
          - cd dist
          - if [ "${BITBUCKET_BRANCH}" != "main" ]; then npm version 0.0.0-${BITBUCKET_BUILD_NUMBER}; fi
          - if [ "${BITBUCKET_BRANCH}" != "main" ]; then npm publish --access public --tag ${BITBUCKET_BRANCH}; fi
          - if [ "${BITBUCKET_BRANCH}" == "main" ]; then npm publish --access public; fi

pipelines:
  branches:
    main:
      - parallel:
          - step: *test
          - step: *chromatic
          - step: *vercel
  pull-requests:
    '**':
      - parallel:
          - step: *test
          - step: *chromatic
  custom:
    publish @reltio/design:
      - step: *publish-reltio-design
