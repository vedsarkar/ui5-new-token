image: node:22

# How releases work in this repo
# ──────────────────────────────────────────────────────────────────────────
# 1. Developers add a `.changeset/*.md` file in each PR that affects
#    `@reltio/*` packages. Authoring is conventional today — see
#    CONTRIBUTING.md → Adding a changeset. A CI guard that catches missing
#    changesets is on the backlog and will be re-introduced once it can
#    correctly trace source changes across the `components/` / `charts/` /
#    `hooks/` / `utils/` re-export layer into `packages/design/`.
# 2. When the CoE is ready to cut a release, a maintainer triggers the
#    custom pipeline `version @reltio packages` against `main`. It bumps
#    versions and writes CHANGELOG entries, then opens a `release/version-*`
#    branch and PR for review.
# 3. After that PR is merged into `main`, the `branches: main` pipeline
#    runs `release-packages` in parallel with the other checks and
#    publishes the new versions to npm + creates annotated git tags.
# 4. For preview / per-PR builds, the custom pipeline `snapshot @reltio
#    packages` publishes a one-off snapshot under a `pr-<id>` dist-tag.
# 5. When `release-packages` publishes new versions, it also posts a
#    single summary message to Slack via the `SLACK_WEBHOOK_URL` repository
#    variable (Repo settings → Pipelines → Repository variables). Only
#    tags created during this run are included — a no-op release (or a
#    rerun of an already-published commit) posts nothing.
# ──────────────────────────────────────────────────────────────────────────

definitions:
  caches:
    node: node_modules
    npm: $HOME/.npm
    playwright: $HOME/.cache/ms-playwright
  steps:
    # Full test suite with coverage — runs on main only.
    - step: &test
        name: Run Tests with Coverage
        caches:
          - npm
          - node
          - playwright
        script:
          - npm ci
          - npx playwright install --with-deps chromium
          - npm run coverage
    # Auth unit tests — Node-only, no Playwright needed. Fast (~5 s).
    - step: &test-auth
        name: Unit Tests (auth)
        caches:
          - npm
          - node
        script:
          - npm ci
          - npx vitest run --project auth
    # Storybook browser tests — only files changed since origin/main.
    # No coverage overhead. Runs on PRs for fast feedback.
    - step: &test-storybook-changed
        name: Storybook Tests (changed)
        caches:
          - npm
          - node
          - playwright
        script:
          - npm ci
          - npx playwright install --with-deps chromium
          - git fetch --depth=200 origin main
          - npx vitest run --project storybook --changed origin/main
    # Type-check + compile the publishable packages — the same `tsc` build
    # that runs at publish time. Catches type errors in PRs that the test /
    # chromatic steps miss, since `tsc` only ran during release before.
    - step: &build-packages
        name: Build @reltio packages
        caches:
          - npm
          - node
        script:
          - npm ci
          - npm run build-css
          - npm run build --workspace=@reltio/design
          - npm run build --workspace=@reltio/auth
          - npm run build --workspace=@reltio/skills
          - npm run build --workspace=@reltio/app
    - step: &chromatic
        name: Deploy to Chromatic
        caches:
          - npm
          - node
        script:
          - npm ci
          - npm run deploy
    - step: &vercel
        name: Deploy to Vercel
        caches:
          - npm
          - node
        script:
          - npm ci
          - npm install -g vercel
          - vercel link --project=reltio-design --scope=reltio --token=${VERCEL_TOKEN} --yes
          - vercel build --scope=reltio --token=${VERCEL_TOKEN} --prod --yes
          - vercel deploy --scope=reltio --token=${VERCEL_TOKEN} --prod --prebuilt
    - step: &version-packages
        name: Open release/version PR
        caches:
          - npm
          - node
        script:
          # Maintainer-only. Consumes all pending changesets, bumps versions,
          # writes CHANGELOG.md, pushes release/version-* branch, and opens
          # the PR via Bitbucket REST API for human review.
          - git fetch --depth=200 origin main
          - git checkout main
          - git config user.name "reltio-design-bot"
          - git config user.email "ui.coe@reltio.com"
          - npm ci
          - npm run version-packages
          - git add -A
          - |
            if git diff --cached --quiet; then
              echo "No pending changesets — nothing to version."
              exit 0
            fi
          - 'BRANCH="release/version-$(date +%Y%m%d-%H%M%S)"'
          - 'git checkout -b "$BRANCH"'
          - 'git commit -m "DESIGN-1: version packages"'
          - 'git push -u origin "$BRANCH"'
          - 'echo "Versioning branch $BRANCH pushed to origin."'
          # Opens the version PR via Bitbucket REST API when $BITBUCKET_PR_TOKEN
          # is set; otherwise prints a fallback URL and exits 0. See
          # `guides/release-process.story.mdx` → "Maintainer setup".
          - 'VERSION_BRANCH="$BRANCH" node scripts/open-version-pr.mjs'
    - step: &release-packages
        name: Publish @reltio packages to npm
        caches:
          - npm
          - node
        script:
          - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          - git config user.name "reltio-design-bot"
          - git config user.email "ui.coe@reltio.com"
          - npm ci
          - npm run build-css
          - npm run build --workspace=@reltio/design
          - npm run build --workspace=@reltio/auth
          - npm run build --workspace=@reltio/skills
          - npm run build --workspace=@reltio/app
          # Snapshot tags on HEAD *before* publishing, so a rerun on the
          # same commit (retry, manual re-trigger) doesn't re-notify for
          # tags that already existed from an earlier successful run.
          - git tag --points-at HEAD > /tmp/tags-before.txt
          - npm run release
          # ── Slack release notification ──────────────────────────────
          # Only posts for tags that are new since /tmp/tags-before.txt —
          # i.e. actually created by `npm run release` in *this* run.
          # A rerun where release-packages was already published (no-op)
          # posts nothing.
          - |
            MSG=""
            for pkg in design auth skills app; do
              if [ -f "packages/$pkg/package.json" ]; then
                VERSION=$(node -p "require('./packages/$pkg/package.json').version")
                TAG="@reltio/$pkg@$VERSION"
                if git tag --points-at HEAD | grep -qx "$TAG" && ! grep -qx "$TAG" /tmp/tags-before.txt; then
                  MSG="$MSG\n• *$TAG*"
                fi
              fi
            done
            if [ -n "$MSG" ] && [ -n "$SLACK_WEBHOOK_URL" ]; then
              if ! curl -sf --show-error --connect-timeout 5 --max-time 15 \
                -X POST -H 'Content-type: application/json' \
                --data "{\"text\":\"📦 *New reltio-design release(s) published:*${MSG}\n<https://bitbucket.org/reltio-ondemand/reltio-design/branch/main|View repo>\"}" \
                "$SLACK_WEBHOOK_URL"; then
                echo "WARNING: Slack notification failed to send (webhook unreachable or rejected). Not failing the release step for this." >&2
              fi
            else
              echo "No newly published package tags (or SLACK_WEBHOOK_URL not set) — skipping Slack notification."
            fi
    - step: &snapshot-packages
        name: Publish snapshot for current branch
        caches:
          - npm
          - node
        script:
          # Snapshot releases use `changeset version --snapshot` to produce
          # versions like 0.0.0-pr-123-20260512-abcd123, published under a
          # dist-tag rather than `latest`. No git tag, no commit.
          - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          - npm ci
          - 'SNAPSHOT_TAG="${SNAPSHOT_TAG:-pr-${BITBUCKET_PR_ID:-${BITBUCKET_BUILD_NUMBER}}}"'
          - 'echo "Using snapshot dist-tag: $SNAPSHOT_TAG"'
          - npx changeset version --snapshot "$SNAPSHOT_TAG"
          - npm run build-css
          - npm run build --workspace=@reltio/design
          - npm run build --workspace=@reltio/auth
          - npm run build --workspace=@reltio/skills
          - npm run build --workspace=@reltio/app
          - npm run release:snapshot -- --tag "$SNAPSHOT_TAG"

pipelines:
  branches:
    main:
      # All four steps run in parallel. `release-packages` is safe to
      # fire-and-forget alongside the rest because `scripts/release.mjs`
      # asks the npm registry whether each `<name>@<version>` is already
      # published and skips it if so: feature-merge commits do not bump
      # any version, so the script is a ~30 s no-op; version-PR merges
      # contain only JSON + markdown changes, so the parallel `test` /
      # `chromatic` / `vercel` steps cannot detect a regression that the
      # PR pipeline missed. Decoupling them also means a Chromatic or
      # npm-registry blip does not block the others.
      - parallel:
          - step: *test
          - step: *chromatic
          - step: *vercel
          - step: *release-packages
  pull-requests:
    '**':
      - parallel:
          - step: *build-packages
          - step: *test-auth
          - step: *test-storybook-changed
          - step: *chromatic
  custom:
    version @reltio packages:
      # Maintainer-triggered. Run against `main`. Produces a `release/version-*`
      # branch with version bumps + CHANGELOG entries, and opens the PR
      # automatically via the Bitbucket REST API.
      - step: *version-packages
    release @reltio packages:
      # Manual back-up of the auto-release that runs on every `main` commit.
      # Useful when the main pipeline failed mid-publish, the npm registry
      # was down, or you want to retry an out-of-band fix. Idempotent —
      # already-published versions are skipped.
      - step: *release-packages
    snapshot @reltio packages:
      # Developer-triggered from any branch. Publishes a snapshot under the
      # dist-tag `pr-${BITBUCKET_PR_ID}` (or build number) by default.
      # Override by passing the SNAPSHOT_TAG variable when running.
      - variables:
          - name: SNAPSHOT_TAG
            default: ""
      - step: *snapshot-packages
