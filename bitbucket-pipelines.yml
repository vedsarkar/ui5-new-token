image: mcr.microsoft.com/playwright:v1.57.0-noble

definitions:
  caches:
    node: node_modules
    npm: $HOME/.npm

build: &build
  - parallel:
      - step:
          name: Run Tests with Coverage
          caches:
            - npm
            - node
          script:
            - npm ci
            - npm run coverage
      - step:
          name: Deploy to Chromatic
          caches:
            - npm
            - node
          script:
            - npm ci
            - npm run deploy
pipelines:
  branches:
    main: *build
  pull-requests:
    '**': *build
