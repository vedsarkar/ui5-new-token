image: node:lts

definitions:
  caches:
    node: node_modules
    nextcache: .next/cache

build: &build
  - parallel:
      - step:
          name: Run Tests with Coverage
          caches:
            - npm
            - node_modules
          script:
            - npm ci
            - npm run coverage
      - step:
          name: Deploy to Chromatic
          caches:
            - npm
            - node_modules
          script:
            - npm ci
            - npm run deploy
pipelines:
  branches:
    main: *build
  pull-requests:
    '**': *build
